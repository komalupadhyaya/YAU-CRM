<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>New Voicemail Received</title>
</head>
<body style="margin:0;padding:0;background:#09090b;font-family:'Segoe UI',Arial,sans-serif;color:#fafafa;">
<table width="100%" cellpadding="0" cellspacing="0" style="background:#09090b;min-height:100vh;">
  <tr>
    <td align="center" style="padding:40px 16px;">
      <table width="100%" style="max-width:560px;" cellpadding="0" cellspacing="0">

        <!-- Header -->
        <tr>
          <td style="text-align:center;padding-bottom:32px;">
            <div style="display:inline-flex;align-items:center;gap:8px;">
              <span style="font-size:22px;font-weight:800;color:#fafafa;letter-spacing:-0.5px;">YAU<span style="color:#3b82f6;">CRM</span></span>
            </div>
          </td>
        </tr>

        <!-- Card -->
        <tr>
          <td style="background:#18181b;border:1px solid #27272a;border-radius:20px;overflow:hidden;">

            <!-- Purple top bar -->
            <div style="height:4px;background:linear-gradient(90deg,#8b5cf6,#a78bfa);"></div>

            <!-- Body -->
            <div style="padding:36px 32px;">

              <!-- Icon + heading -->
              <div style="text-align:center;margin-bottom:28px;">
                <div style="width:56px;height:56px;border-radius:16px;background:rgba(139,92,246,0.12);border:1px solid rgba(139,92,246,0.25);display:inline-flex;align-items:center;justify-content:center;margin-bottom:16px;">
                  <span style="font-size:28px;line-height:1;">📼</span>
                </div>
                <h1 style="margin:0 0 6px;font-size:20px;font-weight:800;color:#fafafa;letter-spacing:-0.3px;">
                  New Voicemail Received
                </h1>
                <p style="margin:0;font-size:14px;color:#a1a1aa;">
                  A caller left a voicemail on your main company number.
                </p>
              </div>

              <!-- Info card -->
              <div style="background:#09090b;border:1px solid #27272a;border-radius:14px;padding:20px 24px;margin-bottom:24px;">
                <table width="100%" cellpadding="0" cellspacing="0">
                  <tr>
                    <td style="padding-bottom:14px;border-bottom:1px solid #27272a;">
                      <div style="font-size:11px;font-weight:700;color:#71717a;text-transform:uppercase;letter-spacing:0.6px;margin-bottom:4px;">Caller</div>
                      <div style="font-size:16px;font-weight:700;color:#ffffff;">{{FROM_NUMBER}}</div>
                    </td>
                  </tr>
                  <tr>
                    <td style="padding-top:14px;">
                      <div style="font-size:11px;font-weight:700;color:#71717a;text-transform:uppercase;letter-spacing:0.6px;margin-bottom:4px;">Duration</div>
                      <div style="font-size:14px;font-weight:600;color:#a78bfa;">{{DURATION}}</div>
                    </td>
                  </tr>
                </table>
              </div>

              <!-- CTA Button -->
              <div style="text-align:center;margin-bottom:28px;">
                <a href="{{PLAYBACK_URL}}" style="display:inline-block;padding:12px 32px;background:#8b5cf6;color:#ffffff;text-decoration:none;border-radius:10px;font-size:14px;font-weight:700;letter-spacing:0.2px;margin-right:10px;">
                  ▶ Play Voicemail
                </a>
                <a href="{{CRM_URL}}" style="display:inline-block;padding:12px 32px;background:transparent;border:1px solid #27272a;color:#a1a1aa;text-decoration:none;border-radius:10px;font-size:14px;font-weight:700;letter-spacing:0.2px;">
                  Open CRM
                </a>
              </div>

              <!-- Note -->
              <p style="margin:0;font-size:12px;color:#52525b;text-align:center;line-height:1.6;">
                You received this because you are configured to receive voicemail notifications for YAU CRM.
              </p>
            </div>
          </td>
        </tr>

        <!-- Footer -->
        <tr>
          <td style="padding:24px 0 0;text-align:center;">
            <p style="margin:0;font-size:12px;color:#3f3f46;">
              © {{YEAR}} YAU CRM. All rights reserved.
            </p>
          </td>
        </tr>

      </table>
    </td>
  </tr>
</table>
</body>
</html>
